name: Verify dictionary
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.12'
      - run: mise run setup
      - run: mise run check
  release:
    name: release:build reproduces the locale package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.12'
      # --fetch fetches each source's origin commit (Git only). --check fails unless
      # the checkout is clean, the frozen source tree equals that origin commit's tree,
      # and the zip equals the config's expected and published pins; --check-release
      # downloads that Release and compares it byte for byte, and requires every
      # locale/* tag on origin to map to a release/<patch>-<n>.json config matching `published`
      # (or `expect.package` for expect-only configs). --release-cache keeps a fresh per-run
      # copy of each downloaded Release asset so remote tags are fetched once per run while
      # every config still checks its rebuilt zip and support display. A declared support display
      # is checked too: --fetch downloads its pinned inputs, and --check compares a retained
      # display with its origin tree and declared inputs. A second build must match byte for byte.
      - name: Rebuild every declared patch's language package from its pinned source
        run: |
          rm -rf .cache/release/ci-remote
          for config in release/*.json; do
            name=$(basename "$config" .json)
            first=".cache/release/ci-$name-a" second=".cache/release/ci-$name-b"
            mise run release:build -- --config "$config" --out "$first" --fetch --check --check-release --release-cache .cache/release/ci-remote
            mise run release:build -- --config "$config" --out "$second"
            cmp "$first"/pobr-locale-*.zip "$second"/pobr-locale-*.zip
            cmp "$first/receipt.json" "$second/receipt.json"
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: locale-release-receipt
          path: |
            .cache/release/ci-*-a/receipt.json
            .cache/release/ci-*-a/manifest.json
            .cache/release/ci-*-a/SHA256SUMS
            .cache/release/ci-*-a/support-display.zh-CN.json
          if-no-files-found: ignore
  regenerate:
    name: release:regenerate rebuilds the published members from pinned inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.12'
      - uses: actions/cache@v6
        with:
          path: .cache/regenerate/inputs
          key: locale-regenerate-inputs-${{ hashFiles('release/regenerate/*.json') }}
          restore-keys: locale-regenerate-inputs-
      # --fetch fetches each pinned producer revision (Git) and downloads the pinned URL inputs.
      # Every regenerated member must equal its frozen source member byte for byte, and the
      # package assembled from regenerated plus declared-frozen members must equal the
      # published or expect.package zip's SHA-256; the step fails otherwise.
      - name: Regenerate every recipe's package from its producers' pinned inputs
        run: |
          for recipe in release/regenerate/*.json; do
            mise run release:regenerate -- --recipe "$recipe" --fetch
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: locale-regeneration-receipt
          path: .cache/regenerate/*/regeneration.json
          if-no-files-found: ignore
