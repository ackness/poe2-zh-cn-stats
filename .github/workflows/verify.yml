name: Verify dictionary
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: '2026.10.23'
      - run: mise run setup
      - run: mise run check
  release:
    name: release:build reproduces the locale package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: '2026.10.23'
      # --fetch fetches each source's origin commit (Git only). --check fails unless
      # the checkout is clean, the frozen source tree equals that origin commit's
      # and the zip equals the config's expected and published pins; --check-release downloads
      # that Release and compares it byte for byte. A declared support display is checked too:
      # --fetch downloads its pinned inputs, --check compares a retained one with its origin tree
      # and its declared inputs. A second build must match.
      - name: Rebuild every declared patch's language package from its pinned source
        run: |
          for config in release/*.json; do
            name=$(basename "$config" .json)
            first=".cache/release/ci-$name-a" second=".cache/release/ci-$name-b"
            mise run release:build -- --config "$config" --out "$first" --fetch --check --check-release
            mise run release:build -- --config "$config" --out "$second"
            cmp "$first"/pobr-locale-*.zip "$second"/pobr-locale-*.zip
            cmp "$first/receipt.json" "$second/receipt.json"
          done
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: locale-release-receipt
          path: |
            .cache/release/ci-*-a/receipt.json
            .cache/release/ci-*-a/manifest.json
            .cache/release/ci-*-a/SHA256SUMS
            .cache/release/ci-*-a/support-display.zh-CN.json
          if-no-files-found: ignore
  regenerate:
    name: release:regenerate rebuilds the published members from pinned inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: '2026.10.23'
      # --fetch fetches each pinned producer revision (Git) and downloads the pinned URL inputs.
      # Every regenerated member must equal its frozen source member byte for byte, and the
      # package assembled from regenerated plus declared-frozen members must equal the
      # published zip's SHA-256; the step fails otherwise.
      - name: Regenerate every recipe's package from its producers' pinned inputs
        run: |
          for recipe in release/regenerate/*.json; do
            mise run release:regenerate -- --recipe "$recipe" --fetch
          done
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: locale-regeneration-receipt
          path: .cache/regenerate/*/regeneration.json
          if-no-files-found: ignore
