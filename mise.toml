min_version = "2026.10.23"

[tools]
# Keep the resolved runtime aligned with PoBR via the committed mise.lock.
# Refresh explicitly with `mise lock --bump`; npm ships with this Node release.
node = "latest"

[tasks.setup]
description = "Install frozen npm dependencies without running package lifecycle scripts"
run = "npm ci --ignore-scripts --no-audit --no-fund"

[tasks.test]
description = "Run the offline translation and source-provenance regression tests"
run = "npm test"

[tasks.check]
description = "Run tests, then verify current source hashes and byte-identical offline regeneration"
run = ["npm test", "npm run check"]

[tasks.report]
description = "Read the saved coverage and unresolved-source report without fetching data"
run = "npm run report"

[tasks."native:candidate"]
description = "Emit offline native-ID localization candidates from an explicitly pinned RePoE description package"
run = "node src/cli.mjs native"

[tasks."native:check"]
description = "Verify a saved native localization candidate against the same pinned RePoE input"
run = "node src/cli.mjs native-check"

[tasks."publication:check"]
description = "Validate the pinned complete language-owner publication declarations offline"
run = "npm run publication:check"

[tasks."publication:test"]
description = "Run only the small synthetic publication registry regressions"
run = "npm run test:publication"

[tasks."release:build"]
description = "Package release/<patch>.json's pinned language publication as pobr-locale-<patch>.zip + receipt.json under .cache/release/ (--config, --check, --fetch, --check-release)"
run = "node src/locale-release.mjs"

[tasks."release:publish"]
description = "Stage the release:build package as the locale/<patch>-<n> GitHub Release and print the plan; --yes tags, pushes and creates the Release (--config, --dry-run, --reuse)"
run = "node src/locale-release-publish.mjs"

[tasks."pobr:display-texts"]
description = "Project a pinned native catalog into PoBR's display_texts.json; --request FILE --out .cache/FRESH"
run = "node src/pobr-display-texts.mjs"

[tasks."pobr:names"]
description = "Adapt pinned native names into PoBR's three zh-TW ID-keyed sidecars; --request FILE --out .cache/FRESH"
run = "node src/pobr-name-sidecars.mjs"

[tasks."pobr:stat-lines"]
description = "Append selected native effect translations to PoBR's stat_lines.json; pinned --selection/--native/--legacy, --out .cache/FRESH"
run = "node src/pobr-stat-lines.mjs"
